apiVersion: v1
kind: Service
metadata:
  name: productmanagement-api-nodeport
  namespace: productmanagement
  labels:
    app: productmanagement-api
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080  # Access via http://localhost:30080
    protocol: TCP
    name: http
  selector:
    app: productmanagement-api